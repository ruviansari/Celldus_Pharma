<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - Celldus Pharma</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
        }

        .login-container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .success-icon {
            font-size: 3.5rem;
            color: #10b981;
            margin-bottom: 1.5rem;
        }

        .login-header h2 {
            color: #1f2937;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .login-header p {
            color: #6b7280;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .login-btn {
            display: inline-block;
            width: 100%;
            padding: 0.75rem;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.3s ease;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="success-icon">✔️</div>
        <div class="login-header">
            <h2>Password Reset Complete</h2>
            <p>
                Your password has been successfully reset! You can now log in using your new password.
            </p>
        </div>

        <a href="{% url 'dashboard_login' %}" class="login-btn">Log In</a>
    </div>

</body>
</html>
