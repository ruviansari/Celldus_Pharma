          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 30
        payment_terms_days:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        currency:
          type: string
          maxLength: 10
        bank_name:
          type: string
          maxLength: 150
        bank_account_no:
          type: string
          writeOnly: true
          maxLength: 50
        bank_ifsc:
          type: string
          maxLength: 20
        gmp_certificate_no:
          type: string
          maxLength: 100
        qualification_expiry:
          type: string
          format: date
          nullable: true
        created_by:
          type: integer
          nullable: true
        updated_by:
          type: integer
          nullable: true
      required:
      - address
      - city
      - created_at
      - id
      - legal_name
      - state
      - supplier_code
      - updated_at
    SupplierMasterStatusEnum:
      enum:
      - QUALIFIED
      - UNDER_EVALUATION
      - DISQUALIFIED
      - BLOCKED
      type: string
      description: |-
        * `QUALIFIED` - Fully Qualified / GMP Audited
        * `UNDER_EVALUATION` - Under Audit / Evaluation
        * `DISQUALIFIED` - Disqualified / GMP Non-Compliant
        * `BLOCKED` - Blocked for Commercial / Quality issues
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TransactionTypeEnum:
      enum:
      - GRN_RECEIPT
      - QC_RELEASE
      - QC_REJECT
      - MATERIAL_ISSUE
      - PRODUCTION_RECEIPT
      - TRANSFER_IN
      - TRANSFER_OUT
      - DISPATCH
      - CUSTOMER_RETURN
      - ADJUSTMENT_PLUS
      - ADJUSTMENT_MINUS
      - RECALL_BLOCK
      type: string
      description: |-
        * `GRN_RECEIPT` - Goods Receipt Note (Quarantine Inward)
        * `QC_RELEASE` - QC Inspection Release to Stock
        * `QC_REJECT` - QC Inspection Rejection
        * `MATERIAL_ISSUE` - Issue to Production Batch
        * `PRODUCTION_RECEIPT` - Receipt of Finished Goods from Production
        * `TRANSFER_IN` - Warehouse Transfer Inward
        * `TRANSFER_OUT` - Warehouse Transfer Outward
        * `DISPATCH` - Sales Dispatch / Customer Invoice
        * `CUSTOMER_RETURN` - Customer Return Quarantine Inward
        * `ADJUSTMENT_PLUS` - Approved Physical Count Positive Adjustment
        * `ADJUSTMENT_MINUS` - Approved Physical Count Negative Adjustment
        * `RECALL_BLOCK` - Batch Regulatory Recall Block
    UOMConversion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        from_uom_code:
          type: string
          readOnly: true
        to_uom_code:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        version:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Optimistic locking version counter
        is_active:
          type: boolean
        conversion_factor:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        created_by:
          type: integer
          nullable: true
        updated_by:
          type: integer
          nullable: true
        from_uom:
          type: string
          format: uuid
        to_uom:
          type: string
          format: uuid
      required:
      - conversion_factor
      - created_at
      - from_uom
      - from_uom_code
      - id
      - to_uom
      - to_uom_code
      - updated_at
    UnitOfMeasure:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        version:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Optimistic locking version counter
        is_active:
          type: boolean
        code:
          type: string
          description: e.g. KG, GM, MG, LTR, ML, TAB, CAP, STRIP
          maxLength: 20
        name:
          type: string
          maxLength: 100
        symbol:
          type: string
          maxLength: 10
        is_discrete:
          type: boolean
          description: True for countable items (Tablets, Strips)
        created_by:
          type: integer
          nullable: true
        updated_by:
          type: integer
          nullable: true
      required:
      - code
      - created_at
      - id
      - name
      - symbol
      - updated_at
    UserBrief:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - id
      - username
    UserContextResponse:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        full_name:
          type: string
        is_superuser:
          type: boolean
        roles:
          type: array
