        role_names:
          type: array
          items:
            type: string
      required:
      - email
      - full_name
      - id
      - is_superuser
      - role_names
      - roles
      - username
    Warehouse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        branch_name:
          type: string
          readOnly: true
        bins:
          type: array
          items:
            $ref: '#/components/schemas/StorageBin'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        version:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Optimistic locking version counter
        is_active:
          type: boolean
        code:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 150
        controlled_access:
          type: boolean
          description: Requires specialized authorization (e.g. Narcotic/High-value)
        temperature_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
