components:
  schemas:
    AccountTypeEnum:
      enum:
      - ASSET
      - LIABILITY
      - EQUITY
      - REVENUE
      - EXPENSE
      type: string
      description: |-
        * `ASSET` - Asset (Cash, Bank, Inventory, AR)
        * `LIABILITY` - Liability (AP, Taxes Payable, Loans)
        * `EQUITY` - Equity (Capital, Retained Earnings)
        * `REVENUE` - Revenue (Domestic Sales, Export Sales)
        * `EXPENSE` - Expense (COGS, Raw Material, Operating, Payroll)
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE_ATTEMPT
      - APPROVE
      - REJECT
      - POST
      - DISPATCH
      - QA_RELEASE
      - QA_REJECT
      - QA_HOLD
      - RECALL
      - LOGIN
      - LOGOUT
      - SECURITY_ALERT
      type: string
      description: |-
        * `CREATE` - Created Record
        * `UPDATE` - Updated Record
        * `DELETE_ATTEMPT` - Blocked Delete Attempt
        * `APPROVE` - Authorized Approval
        * `REJECT` - Rejected with Reason
        * `POST` - Financial / Stock Ledger Posted
        * `DISPATCH` - Material Dispatched
        * `QA_RELEASE` - QA Batch Released
        * `QA_REJECT` - QA Batch Rejected
        * `QA_HOLD` - QA Quarantine / Hold Imposed
        * `RECALL` - Product Batch Recalled
        * `LOGIN` - User Login
        * `LOGOUT` - User Logout
        * `SECURITY_ALERT` - Security Exception / Violation
    ActivityTypeEnum:
      enum:
      - CALL
      - VISIT
      - EMAIL
      - MEETING
      type: string
      description: |-
        * `CALL` - Phone Call
        * `VISIT` - In-Person Detailing / Visit
        * `EMAIL` - Email Follow-up / Quotation
        * `MEETING` - Commercial Negotiation Meeting
