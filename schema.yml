openapi: 3.0.3
info:
  title: Celldus Pharma Enterprise ERP API
  version: 1.0.0
  description: Production-ready pharmaceutical ERP APIs covering Masters, FEFO Inventory,
    Procurement & GRN, QC/QA QMS, BMR/BPR Manufacturing, Sales, CRM, Finance, and
    HR.
paths:
  /api/v1/core/audit-logs/:
    get:
      operationId: v1_core_audit_logs_list
      description: |-
        Immutable 21 CFR Part 11 compliant audit trail inspector.
        Supports filtering by entity_name, action, document_no, user, and date range.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/core/audit-logs/{id}/:
    get:
      operationId: v1_core_audit_logs_retrieve
      description: |-
        Immutable 21 CFR Part 11 compliant audit trail inspector.
        Supports filtering by entity_name, action, document_no, user, and date range.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Audit Trail Record.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/core/auth/login/:
    post:
      operationId: v1_core_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/core/auth/me/:
    get:
      operationId: v1_core_auth_me_retrieve
      description: Returns current user details, active ERP roles, and branch permissions.
      tags:
